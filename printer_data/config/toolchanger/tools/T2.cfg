# This file contains Stealthchanger config for the LDO Nitehawk-36 Toolboard
# To use this config, the firmware should be compiled for the Raspberry Pi RP2040

# Use the replace function in your text editor of choice to replace 2 with the tool number, for example "1" for tool 1

# See https://docs.ldomotors.com/en/voron/nitehawk-sb#firmware-setup-and-update
# For instructions on uploading/updating klipper firmware to the PCB

## LDO Nitehawk-36 for Stealthchanger Config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Rotation_distance                    [extruder] section
## Gear Ratio                           [extruder] section
## Thermistor types                     [extruder] section
## PID values                           [extruder] section
## gcode xyz offsets                    [tool T2] section
## xyz offsets                          [tool_probe T2] section

## *MAKE SURE* to include this config file *AFTER* the main controller config. 
## This will ensure the relavent sections are overwritten by the pin mappings specified here.
[mcu nhkT2]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3232323236193A98-if00
restart_method: command

#####################################################################
# Extruder2
#####################################################################
[extruder2]
step_pin: nhkT2:gpio23
dir_pin: !nhkT2:gpio24
enable_pin: !nhkT2:gpio25
microsteps: 16
full_steps_per_rotation: 200
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
rotation_distance: 47.088
gear_ratio: 9:1 # Reduction ratio (Galileo/Orbiter gear ratio 7.5:1, BMG is 50:17, Galileo2 is 9:1)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhkT2:gpio9
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhkT2:gpio29
pullup_resistor: 2200
min_temp: 0
max_temp: 290
max_power: 1.0 
min_extrude_temp: 170
pressure_advance: 0.04
pressure_advance_smooth_time:0.040
max_extrude_cross_section: 2.0
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
#Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder2 TARGET=245
# pid_Kp=27.864 pid_Ki=3.096 pid_Kd=62.695
control= pid
pid_kp = 27.864
pid_ki = 3.096
pid_kd = 62.695

[tmc2209 extruder2]
uart_pin: nhkT2: gpio0
sense_resistor: 0.100
interpolate: False
run_current: 0.6
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################
# [multi_fan T2_partfan] 
[fan_generic T2_partfan]
pin: nhkT2:gpio6

[heater_fan T2_hotend_fan]
pin: nhkT2:gpio5
#tachometer_pin: nhkT2:gpio16
#tachometer_ppr: 2
heater: extruder2
heater_temp: 50.0
kick_start_time: 0.5

#####################################################################
#   Filament Sensor
#####################################################################
#[filament_switch_sensor filament_sensor]
#switch_pin: nhkT2:gpio3
#pause_on_runout: True

#####################################################################
#   Accelerometer
#####################################################################
[adxl345 T2]
cs_pin: nhkT2:gpio27
spi_software_sclk_pin: nhkT2:gpio18
spi_software_mosi_pin: nhkT2:gpio20
spi_software_miso_pin: nhkT2:gpio19
axes_map: x,z,y

#####################################################################
#   Toolchanger Configs
#####################################################################
[gcode_macro T2]
variable_color: ""
gcode:
  SELECT_TOOL T=2

[tool T2]
tool_number: 2
extruder: extruder2
fan: T2_partfan
gcode_x_offset: 0.079688
gcode_y_offset: 0.595312
gcode_z_offset: -0.142500
params_type: 'sc'
#This is the path the tool change takes. Shouldn't have to change it. Unless
#you are using a custom dock
params_sc_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 238.10 # 237.80
params_park_y: -5.6 # -5.00
params_park_z: 245.100
params_safe_y: 120.0
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 55.6 # accel <= 9100
# params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 44.0 # accel <= 5700
# params_input_shaper_damping_ratio_y: 0.01  

[tool_probe T2]
pin: nhkT2:gpio10
tool: 2
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
z_offset: 0 # Z axis-sensor relative nozzle offset
# drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2